[project]
name = "bookml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "nltk>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.6",
    "torch>=2.0",
    "torchvision>=0.15",
    "selenium>=4.51.0",
    "xgboost>=3.0",
]


[project.optional-dependencies]
# Needed only for the "sentence_embeddings" feature (pulls in PyTorch).
embeddings = [
    "sentence-transformers>=5.0",
]

[project.scripts]
bookml = "bookml:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
